# Databricks Asset Bundle for the Citi Bike project.
#
# Jobs are defined in resources/*.job.yml and run the notebooks in jobs/:
#   citibike_download       weekly: monthly trip archives, then starts citibike_prepare
#   external_data_download  daily: MTA, weather and GBFS sources
#   citibike_prepare        cleans the raw files into the Delta tables in ${var.catalog}.${var.schema}
#
# Deploy and run from your computer:
#   databricks bundle validate
#   databricks bundle deploy            (dev target: job names get a "[dev <you>]" prefix, schedules PAUSED)
#   databricks bundle deploy -t prod    (prod target: schedules ACTIVE)
#   databricks bundle run citibike_prepare [-t prod]
# or from the workspace: open this file in your Git folder and use the Deployments panel (rocket icon).

bundle:
  name: citibike-ingest

include:
  - resources/*.yml

# Only code is uploaded. Data lives in the volume and tables, and local environments stay local.
sync:
  exclude:
    - datasource/**
    - .venv/**

variables:
  catalog:
    description: Unity Catalog catalog for the raw data (Free Edition uses "workspace").
    default: workspace
  schema:
    description: Schema that holds the volume and the tables.
    default: citibike
  volume:
    description: Volume where archives and CSVs are stored.
    default: raw
  notify_email:
    description: Address for failure and slow-run alerts.
    default: ${workspace.current_user.userName}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ea9cccbd-698c.cloud.databricks.com
      profile: cuny

  prod:
    mode: production
    workspace:
      host: https://dbc-ea9cccbd-698c.cloud.databricks.com
      profile: cuny
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: ${workspace.current_user.userName}
    presets:
      trigger_pause_status: UNPAUSED
